services:
  backend:
    build:
      context: ./backend
    container_name: omnichannel-backend
    env_file:
      - ./backend/.env
    command: >
      sh -c "python -m app.scripts.create_indexes --retries 20 --retry-delay 2 &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ENABLE_EXTERNAL_SERVICES=${ENABLE_EXTERNAL_SERVICES:-true}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/commerce}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: omnichannel-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mongo:
    image: mongo:7.0
    container_name: omnichannel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: omnichannel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: omnichannel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: omnichannel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
